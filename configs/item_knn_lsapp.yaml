model: item_knn
data:
  train_path: data/processed/lsapp/train.parquet
  val_path: data/processed/lsapp/val.parquet
dataset: lsapp
eval:
  metrics: # LSApp exception (docs/00-karar-notu.md SS3), see configs/pop_lsapp.yaml
    - {name: hr, k: 1}
    - {name: hr, k: 3}
    - {name: mrr, k: 5}
hyperparameters:
  neighborhood_size: 100 # catalog is ~85 apps, so this is effectively unbounded
    # (no truncation) -- kept identical to the RetailRocket default rather than
    # special-cased, since it changes nothing behaviorally here.
