model: sasrec
data:
  train_path: data/processed/retailrocket/train.parquet
  val_path: data/processed/retailrocket/val.parquet
dataset: retailrocket
eval:
  k: 10
checkpoint_dir: null # set to the Colab Drive mount path before running there, e.g. /content/drive/MyDrive/thesis-checkpoints/sasrec
training:
  batch_size: 256 # A6 fixed, not searched -- kept at 256 despite SASRec's higher
    # GPU memory/time cost vs GRU4Rec/LSTM; accepted tradeoff, not a reason to shrink it.
  max_seq_len: 50 # A6 fixed, not searched
  max_epochs: 50 # safety cap; early stopping (patience) expected to trigger first
  patience: 5 # A6 fixed: early stopping on val NDCG@10
  random_seed: 42 # seed for the one-time Optuna search
  seeds: [42, 43, 44, 45, 46] # 5 seeds for final training + mean±std reporting (CLAUDE.md rule 9)
  device: null # null -> auto (cuda if available else cpu)
  num_workers: 0 # DataLoader background workers; execution setting only, not a model hyperparameter.
    # Same profiling conclusion as gru4rec.yaml/lstm.yaml applies (median session length
    # is small, so worker startup cost dominates over the padding it would parallelize).
optuna:
  n_trials: 20 # A6 locked budget, per model, non-negotiable
  n_jobs: 1 # parallel Optuna trials; bump on Colab if GPU memory allows
  search_val_sample_sessions: 2000 # subsample of val sessions for fast per-trial scoring; final report uses full val
  search_space:
    num_heads: { low: 1, high: 4 } # A6: dikkat başlığı
    num_blocks: { low: 1, high: 3 } # A6: blok
    hidden_size: { low: 64, high: 256 } # A6: gizli boyut; repaired to a multiple of num_heads
      # (nn.MultiheadAttention requires hidden_size % num_heads == 0) by
      # src.models.sasrec.repair_hidden_size, called from run_sasrec.py's _tune()
    dropout: { low: 0.1, high: 0.5 } # A6: dropout
    learning_rate: { low: 0.0001, high: 0.01, log: true } # not listed in A6's SASRec row
      # (unlike GRU4Rec/LSTM); reusing their exact range here since training still
      # requires a learning rate and no fixed value is specified elsewhere.
