model: lstm
data:
  train_path: data/processed/retailrocket/train.parquet
  val_path: data/processed/retailrocket/val.parquet
dataset: retailrocket
eval:
  k: 10
checkpoint_dir: null # set to the Colab Drive mount path before running there, e.g. /content/drive/MyDrive/thesis-checkpoints/lstm
training:
  batch_size: 256 # A6 fixed, not searched
  max_seq_len: 50 # A6 fixed, not searched
  max_epochs: 50 # safety cap; early stopping (patience) expected to trigger first
  patience: 5 # A6 fixed: early stopping on val NDCG@10
  random_seed: 42 # seed for the one-time Optuna search
  seeds: [42, 43, 44, 45, 46] # 5 seeds for final training + mean±std reporting (CLAUDE.md rule 9)
  device: null # null -> auto (cuda if available else cpu)
  num_workers: 0 # DataLoader background workers; execution setting only, not a model hyperparameter.
    # Profiled at 0 vs 2 on 500 sessions: per-batch padding here is cheap (median
    # session length ~2), so multiprocessing worker startup cost dominated and made
    # 2 *slower* (macOS spawn; Colab's Linux fork is cheaper but unverified here).
    # Bump this only after confirming it actually helps in the real Colab run.
optuna:
  n_trials: 20 # A6 locked budget, per model, non-negotiable
  n_jobs: 1 # parallel Optuna trials; bump on Colab if GPU memory allows (e.g. 4)
  search_val_sample_sessions: 2000 # subsample of val sessions for fast per-trial scoring; final report uses full val
  search_space:
    hidden_size: { low: 64, high: 256 }
    num_layers: { low: 1, high: 2 }
    dropout: { low: 0.1, high: 0.5 }
    learning_rate: { low: 0.0001, high: 0.01, log: true }
